[project]
name = "post-production"
version = "0.2.11"
description = "A pipeline for post-production of the Teaching Python podcast"
authors = [
    { name = "Sean Tibor", email = "40579452+seantibor@users.noreply.github.com" },
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.32.0",
    "python-dotenv>=1.0.0",
    "tabulate>=0.9.0",
    "ffmpeg-python>=0.2.0",
    "typer>=0.15.0",
    "tqdm>=4.67.0",
    "pydub>=0.25.1",
    "alive-progress>=3.2.0",
    "boto3>=1.35.0",
]

[project.urls]
Repository = "https://github.com/teachingpython/post-production"

[project.scripts]
tppp = "post_production.main:app"

[dependency-groups]
dev = ["pytest>=8.3.0", "rope>=1.13.0", "ruff>=0.9.0", "pre-commit>=4.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "S", "B", "UP"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
